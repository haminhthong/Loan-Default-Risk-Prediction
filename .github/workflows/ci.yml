name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements-dev.txt
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python -m compileall -q src app scripts
      - run: docker build -t loan-default-risk:test .
      - name: Smoke test API container
        run: |
          set -Eeuo pipefail
          container_id="$(docker run --detach --publish 8000:8000 loan-default-risk:test)"
          cleanup() {
            docker logs "$container_id" || true
            docker rm -f "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --connect-timeout 2 --max-time 5 \
              http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done
          echo "API không khởi động trong thời gian cho phép."
          exit 1
